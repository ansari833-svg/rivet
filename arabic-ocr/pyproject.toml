[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-ocr"
version = "0.1.0"
description = "Two-pass Arabic page transcription (Surya writes, Claude verifies) for classical printed books."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "surya-ocr",
    # torch/torchvision are declared directly (though surya-ocr pulls them in
    # transitively) so the CPU index pin in [tool.uv.sources] below binds.
    "torch",
    "torchvision",
    "Pillow",
    "anthropic",
    "natsort",
    "colorama",
]

[project.scripts]
arabic-ocr = "arabic_ocr.main:main"

[tool.setuptools]
packages = ["arabic_ocr"]

# PyTorch (pulled in by surya-ocr, together with torchvision) resolves to the
# CPU-only build. This keeps installs off the multi-gigabyte CUDA wheels on
# machines without an NVIDIA GPU. To build against a CUDA GPU instead, point the
# index URL below at the matching channel, e.g.
# https://download.pytorch.org/whl/cu124
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'win32'" }
