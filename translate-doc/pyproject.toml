[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "translate-doc"
version = "1.0.0"
description = "Translate Arabic .docx files into English using the Anthropic Claude API (Windows)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "python-docx>=1.1",
    "colorama>=0.4.6",
    "natsort>=8.4",
    "docx2pdf>=0.1.8",
]

[project.scripts]
translate-doc = "translate_doc.main:main"

[tool.setuptools]
packages = ["translate_doc"]
