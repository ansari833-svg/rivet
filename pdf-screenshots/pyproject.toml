[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-screenshots"
version = "1.0.0"
description = "Convert each page of a PDF into a consistently sized JPEG image (Windows CLI tool)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pypdfium2",
    "Pillow",
    "colorama",
]

[project.scripts]
pdf-screenshots = "pdf_screenshots.main:main"

[tool.setuptools.packages.find]
include = ["pdf_screenshots*"]
